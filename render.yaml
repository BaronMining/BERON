services:
  - type: web
    name: beron-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BERON_AI_PROVIDER
        value: openai
      - key: BERON_OPENAI_MODEL
        value: gpt-4o-mini
      - key: BERON_OPENAI_API_KEY
        sync: false
